<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" style="background:#0a0c10; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="460" y="38" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">BiometricAppLock Architecture</text>
  <text x="460" y="62" text-anchor="middle" fill="#94a3b8" font-size="13">Zero-trust biometric authentication, salted Keychain PIN verification, and multitasking privacy veil</text>

  <!-- Module 1: SwiftUI Layer -->
  <g transform="translate(40, 95)" filter="url(#cardGlow)">
    <rect width="250" height="280" rx="14" fill="#131722" stroke="#2d3748" stroke-width="1.5" />
    <rect width="250" height="38" rx="14" fill="url(#primaryGrad)" />
    <rect y="26" width="250" height="12" fill="url(#primaryGrad)" />
    <text x="125" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">SwiftUI View Layer</text>

    <!-- Content Items -->
    <rect x="18" y="55" width="214" height="42" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="28" y="74" fill="#38bdf8" font-size="12" font-weight="600">.appLock(coordinator:)</text>
    <text x="28" y="89" fill="#94a3b8" font-size="10">Declarative hierarchy modifier</text>

    <rect x="18" y="107" width="214" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="28" y="126" fill="#f8fafc" font-size="12" font-weight="600">BiometricLockView</text>
    <text x="28" y="142" fill="#94a3b8" font-size="10">Keypad (0-9) + Animated Dots</text>

    <rect x="18" y="163" width="214" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="28" y="182" fill="#f8fafc" font-size="12" font-weight="600">Privacy Veil Shield</text>
    <text x="28" y="198" fill="#94a3b8" font-size="10">Snapshot blur on backgrounding</text>

    <rect x="18" y="219" width="214" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="28" y="238" fill="#f8fafc" font-size="12" font-weight="600">Shake & Haptics</text>
    <text x="28" y="254" fill="#94a3b8" font-size="10">GeometryEffect + CoreHaptics</text>
  </g>

  <!-- Module 2: State Coordinator -->
  <g transform="translate(335, 95)" filter="url(#cardGlow)">
    <rect width="250" height="280" rx="14" fill="#131722" stroke="#2d3748" stroke-width="1.5" />
    <rect width="250" height="38" rx="14" fill="url(#purpleGrad)" />
    <rect y="26" width="250" height="12" fill="url(#purpleGrad)" />
    <text x="125" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">LockStateCoordinator</text>

    <!-- Content Items -->
    <rect x="18" y="55" width="214" height="42" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="28" y="74" fill="#c084fc" font-size="12" font-weight="600">Lifecycle Sentinel</text>
    <text x="28" y="89" fill="#94a3b8" font-size="10">scenePhase & ResignActive tracking</text>

    <rect x="18" y="107" width="214" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="28" y="126" fill="#f8fafc" font-size="12" font-weight="600">Auto-Lock Grace Timer</text>
    <text x="28" y="142" fill="#94a3b8" font-size="10">Elapsed background duration check</text>

    <rect x="18" y="163" width="214" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="28" y="182" fill="#f8fafc" font-size="12" font-weight="600">Rate Limiter / Lockout</text>
    <text x="28" y="198" fill="#94a3b8" font-size="10">Exponential cooldown penalties</text>

    <rect x="18" y="219" width="214" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="28" y="238" fill="#f8fafc" font-size="12" font-weight="600">State Publisher</text>
    <text x="28" y="254" fill="#94a3b8" font-size="10">isLocked, isVeiled, lockoutUntil</text>
  </g>

  <!-- Module 3: Security & Storage -->
  <g transform="translate(630, 95)" filter="url(#cardGlow)">
    <rect width="250" height="280" rx="14" fill="#131722" stroke="#2d3748" stroke-width="1.5" />
    <rect width="250" height="38" rx="14" fill="url(#emeraldGrad)" />
    <rect y="26" width="250" height="12" fill="url(#emeraldGrad)" />
    <text x="125" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">Security & Biometrics</text>

    <!-- Content Items -->
    <rect x="18" y="55" width="214" height="42" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="28" y="74" fill="#34d399" font-size="12" font-weight="600">BiometricAuthManager</text>
    <text x="28" y="89" fill="#94a3b8" font-size="10">Face ID, Touch ID, Optic ID (LAContext)</text>

    <rect x="18" y="107" width="214" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="28" y="126" fill="#f8fafc" font-size="12" font-weight="600">PinSecurityManager</text>
    <text x="28" y="142" fill="#94a3b8" font-size="10">CryptoKit SHA-256 + 16B Salt</text>

    <rect x="18" y="163" width="214" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="28" y="182" fill="#f8fafc" font-size="12" font-weight="600">Apple Keychain Services</text>
    <text x="28" y="198" fill="#94a3b8" font-size="10">kSecClassGenericPassword</text>

    <rect x="18" y="219" width="214" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="28" y="238" fill="#f8fafc" font-size="12" font-weight="600">Timing Attack Defense</text>
    <text x="28" y="254" fill="#94a3b8" font-size="10">Constant-time digest equality</text>
  </g>

  <!-- Connectors -->
  <path d="M 290 235 L 335 235" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="335,235 327,230 327,240" fill="#3b82f6" />

  <path d="M 585 235 L 630 235" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="630,235 622,230 622,240" fill="#10b981" />

  <!-- Bottom Badges -->
  <g transform="translate(195, 392)">
    <rect width="120" height="22" rx="6" fill="#1e293b" />
    <text x="60" y="15" text-anchor="middle" fill="#94a3b8" font-size="11">iOS 15+ / macOS 12+</text>
  </g>
  <g transform="translate(330, 392)">
    <rect width="130" height="22" rx="6" fill="#1e293b" />
    <text x="65" y="15" text-anchor="middle" fill="#94a3b8" font-size="11">Swift 5.9 & Swift 6</text>
  </g>
  <g transform="translate(475, 392)">
    <rect width="115" height="22" rx="6" fill="#1e293b" />
    <text x="57" y="15" text-anchor="middle" fill="#94a3b8" font-size="11">Zero Dependencies</text>
  </g>
  <g transform="translate(605, 392)">
    <rect width="110" height="22" rx="6" fill="#1e293b" />
    <text x="55" y="15" text-anchor="middle" fill="#94a3b8" font-size="11">100% Test Coverage</text>
  </g>
</svg>
